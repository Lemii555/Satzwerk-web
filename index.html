<style>
@font-face{font-family:"Fraunces";src:url("/fonts/fraunces.woff2") format("woff2");font-weight:100 900;font-display:swap;font-style:normal}
@font-face{font-family:"Public Sans";src:url("/fonts/publicsans.woff2") format("woff2");font-weight:100 900;font-display:swap;font-style:normal}

:root{
  --grund:#FFFFFF;--band:#F5F5F7;--tinte:#1D1D1F;
  --leise:#6E6E73;--kante:#D9D9DE;--akzent:#8116E0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-mode="hell"]){
    --grund:#000000;--band:#1C1C1E;--tinte:#FFFFFF;
    --leise:#A1A1A6;--kante:#48484A;--akzent:#B07CFF;
  }
}
:root[data-mode="dunkel"]{
  --grund:#000000;--band:#1C1C1E;--tinte:#FFFFFF;
  --leise:#A1A1A6;--kante:#48484A;--akzent:#B07CFF;
}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--grund);color:var(--tinte);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.6;
  display:flex;flex-direction:column;
}

main{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:64px 24px 40px;max-width:560px;margin:0 auto;
}

.bildmarke{
  width:clamp(150px,34vw,210px);height:auto;display:block;
  color:var(--tinte);margin:0 0 36px;
  opacity:0;filter:blur(8px);
  animation:auf .9s cubic-bezier(.16,1,.3,1) forwards;
}
.wortmarke{
  font-family:"Fraunces","Iowan Old Style","Palatino Linotype",serif;
  font-weight:700;font-size:clamp(38px,9vw,58px);line-height:1;
  letter-spacing:-.02em;margin:0 0 14px;
  opacity:0;filter:blur(8px);
  animation:auf .9s cubic-bezier(.16,1,.3,1) .12s forwards;
}
.claim{
  font-family:"Fraunces","Iowan Old Style","Palatino Linotype",serif;
  font-weight:600;font-size:clamp(18px,4vw,21px);line-height:1.4;
  margin:0 0 44px;color:var(--tinte);
  opacity:0;filter:blur(8px);
  animation:auf .9s cubic-bezier(.16,1,.3,1) .24s forwards;
}
.hinweis{
  color:var(--leise);font-size:17px;margin:0 0 8px;max-width:44ch;
  opacity:0;transform:translateY(12px);
  animation:hoch .8s cubic-bezier(.16,1,.3,1) .36s forwards;
}
.hinweis-klein{
  color:var(--leise);font-size:15px;margin:0;max-width:44ch;
  opacity:0;transform:translateY(12px);
  animation:hoch .8s cubic-bezier(.16,1,.3,1) .44s forwards;
}
.hinweis a,.hinweis-klein a{color:var(--akzent);text-decoration:none}
.hinweis a:hover,.hinweis-klein a:hover{text-decoration:underline}

@keyframes auf{to{opacity:1;filter:blur(0)}}
@keyframes hoch{to{opacity:1;transform:translateY(0)}}

footer{
  padding:0 24px 40px;text-align:center;
  color:var(--leise);font-size:15px;
  opacity:0;animation:auf .8s cubic-bezier(.16,1,.3,1) .6s forwards;
}
footer nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
footer a{color:var(--leise);text-decoration:none}
footer a:hover{color:var(--tinte)}
a:focus-visible{outline:2px solid var(--akzent);outline-offset:3px;border-radius:4px}

.schalter{
  position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:10;
}
.schalter button{
  background:var(--grund);border:1px solid var(--kante);color:var(--leise);
  font:inherit;font-size:14px;padding:5px 12px;border-radius:980px;cursor:pointer;line-height:1.2;
}
.schalter button:hover{color:var(--tinte)}
.schalter button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}

/* Sprachumschaltung: nur Inhalte im Dokumentkörper, niemals html oder body */
main [lang="en"],footer [lang="en"]{display:none}
html[data-lang="en"] main [lang="de"],
html[data-lang="en"] footer [lang="de"]{display:none}
html[data-lang="en"] main [lang="en"]{display:block}
html[data-lang="en"] footer a[lang="en"]{display:inline}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;filter:none!important;
    opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<div class="schalter">
  <button id="sprache" type="button">EN</button>
  <button id="modus" type="button" aria-label="Hell oder dunkel umschalten">&#9680;</button>
</div>

<main>

  <p class="hinweis-klein" lang="en">
    The iPhone app is coming to the App Store shortly.

<script>
(function(){
  var h=document.documentElement;

  var g=null;
  try{g=localStorage.getItem('sw-lang');}catch(e){}
  setLang(g||((navigator.language||'de').slice(0,2)==='de'?'de':'en'));

  document.getElementById('sprache').addEventListener('click',function(){
    setLang(h.getAttribute('data-lang')==='en'?'de':'en');
  });

  function setLang(l){
    h.setAttribute('data-lang',l);
    document.getElementById('sprache').textContent=(l==='en'?'DE':'EN');
    try{localStorage.setItem('sw-lang',l);}catch(e){}
  }

  var m=null;
  try{m=localStorage.getItem('sw-mode');}catch(e){}
  if(m){h.setAttribute('data-mode',m);}

  document.getElementById('modus').addEventListener('click',function(){
    var jetzt=h.getAttribute('data-mode');
    var dunkel=window.matchMedia('(prefers-color-scheme: dark)').matches;
    var neu=!jetzt?(dunkel?'hell':'dunkel'):(jetzt==='dunkel'?'hell':'dunkel');
    h.setAttribute('data-mode',neu);
    try{localStorage.setItem('sw-mode',neu);}catch(e){}
  });
})();
</script>

</body>
</html>
